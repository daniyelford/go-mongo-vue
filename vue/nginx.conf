server {
    listen 80;
    server_name localhost;

    # مسیر فایل‌های خروجی Vue
    root /usr/share/nginx/html;
    index index.html;

    # Static assets (JS/CSS/Images)
    location /vue/assets/ {
        alias /usr/share/nginx/html/vue/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # صفحه اصلی Vue (SPA)
    location /vue/ {
        alias /usr/share/nginx/html/vue/;
        index index.html;
        try_files $uri $uri/ /vue/index.html;
    }

    # مسیر Go backend
    location /api/ {
        proxy_pass http://go:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # مسیر Laravel backend
    location /laravel-api/ {
        proxy_pass http://nginx-laravel:90/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    error_page 404 /vue/index.html;
}
