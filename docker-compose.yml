services:
  mongo:
    image: mongo:4.4
    container_name: mongodb
    environment:
      - MONGO_INITDB_DATABASE=goMongoVue
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "127.0.0.1/test", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  redis:
    image: redis:7
    container_name: redisdb
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  go:
    build: ./go
    image: dnylfrd/go-mongo-vue:go-1
    container_name: go-server
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_ADDR=redis:6379
      - REDIS_PASS=redisPass123
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=password123
      - MINIO_BUCKET=media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  vue:
    build: ./vue
    image: dnylfrd/go-mongo-vue:vue-1
    container_name: vue-client
    ports:
      - "3000:80"
    depends_on:
      go:
        condition: service_healthy
    volumes:
      - ./vue/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
volumes:
  mongo-data:
  redis-data:
  minio-data:
  mysql-data:
networks:
  app-network:
    driver: bridge